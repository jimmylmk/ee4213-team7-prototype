name: Deploy SafeSwap Prototype to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - sprint-2-prototype-v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Design System SaaS Landing Page/package-lock.json'

      - name: Install dependencies
        working-directory: './Design System SaaS Landing Page'
        run: npm ci

      - name: Build Vite React SaaS
        working-directory: './Design System SaaS Landing Page'
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Design System SaaS Landing Page/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
